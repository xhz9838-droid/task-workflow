#### 4) 审批逻辑（`<script setup>` 内）

```ts
// 新增响应式状态
const approveDialog = reactive({
  visible: false,
  loading: false,
  submitting: false,
  batchId: '' as string,
  summary: {} as Record<string, any>,
})

async function openApproveDialog(row: any) {
  approveDialog.visible = true
  approveDialog.loading = true
  approveDialog.batchId = row.id
  approveDialog.summary = {}
  try {
    const res = await getSalarySummary(row.id)
    approveDialog.summary = res?.data ?? res ?? {}
  } catch {
    ElMessage.error('获取薪酬汇总失败')
    approveDialog.visible = false
  } finally {
    approveDialog.loading = false
  }
}

async function doApprove() {
  try {
    await ElMessageBox.confirm('确认审批通过该薪酬批次？', '审批确认', {
      confirmButtonText: '确认通过',
      cancelButtonText: '取消',
      type: 'warning',
    })
  } catch {
    return // 用户取消
  }
  approveDialog.submitting = true
  try {
    await approveSalaryBatch(approveDialog.batchId)
    ElMessage.success('审批通过')
    approveDialog.visible = false
    refresh() // 刷新列表
  } catch (e: any) {
    ElMessage.error(e?.message || '审批失败')
  } finally {
    approveDialog.submitting = false
  }
}
```

