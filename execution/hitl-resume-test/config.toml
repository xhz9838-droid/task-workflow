# cc-connect 隔离测试实例配置 —— 仅用于 cc_connect_resume 破坏性补测
# 完全隔离：独立 data_dir / 端口 / 项目，无钉钉平台连接，不影响正式实例
data_dir = "D:\\WorkSpace\\task-workflow\\execution\\hitl-resume-test\\ccdata"
language = "zh"

[[projects]]
  name = "resume-test"

  [projects.agent]
    type = "claudecode"

    [projects.agent.options]
      mode = "acceptEdits"
      work_dir = "D:\\WorkSpace\\task-workflow\\execution\\hitl-resume-test\\ws"

  # 占位平台（假凭据，连接必失败但允许启动；绝不使用真实钉钉应用凭据）
  [[projects.platforms]]
    type = "dingtalk"

    [projects.platforms.options]
      client_id = "fake-test-client-id"
      client_secret = "fake-test-client-secret"

[log]
  level = "debug"

[webhook]
  enabled = true
  port = 19111
  token = "hitl-resume-test-secret"
  path = "/hook"

[management]
  enabled = true
  port = 19820
  token = "hitl-resume-test-mgmt"
  cors_origins = ["*"]

[bridge]
  enabled = false
