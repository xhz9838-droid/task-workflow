# 项目配置模板（不含真实路径/凭据）
# 复制为 config/projects/{project_key}.yaml 后填写

project:
  key: "${PROJECT_KEY}"
  name: "${PROJECT_NAME}"
  root: "${PROJECT_ROOT}"
  baseline_branch: main

  # 可选：禅道项目归属标识（项目 ID 或名称，可为列表）。
  # 仅给出任务号（如 #3415）启动时，用于验证任务→项目归属；
  # 无法唯一确定则询问用户，不推断。
  # zentao_project: "${ZENTAO_PROJECT_ID}"

  repositories:
    - key: "${REPO_KEY}"
      path: "${REPO_PATH}"
      role: fullstack            # backend | frontend | mobile | database | fullstack
      technology: "${TECH}"
      enabled: true
      build_command: ""
      test_command: ""
      lint_command: ""

  tech_stack: {}

  # 按需启用 Agent（不适用的置 false）
  agents:
    dw-architect: true
    dw-database: true
    dw-java-backend: true
    dw-web-frontend: true
    dw-mobile-app: true
    dw-qa-engineer: true
    dw-integration-reviewer: true

  integrations:
    task_source: none            # zentao | other | none
    ci: none                     # jenkins | other | none
    notification: none           # dingtalk | other | none
