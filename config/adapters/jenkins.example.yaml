# Jenkins 适配器配置（非敏感）
# 敏感值（URL/用户/Token）从 .env 读取，不写入本文件
# 用法：复制为 config/adapters/jenkins.yaml 后填写

jenkins:
  enabled: true

  # 敏感值对应的环境变量名（值在 .env）
  base_url_env: "JENKINS_URL"
  user_env: "JENKINS_USER"
  token_env: "JENKINS_TOKEN"

  # 严格白名单：仅允许触发这些 Job；部署 Job 一律禁止自动触发
  jobs:
    - "<job-a>"
    - "<job-b>"

  # Jenkins Job 的构建参数名映射
  param_names:
    repo_url: "REPO_URL"
    branch: "GIT_BRANCH"
    commit: "GIT_COMMIT"
    task: "ZENTAO_TASK_ID"
    workflow: "WORKFLOW_ID"
    scope: "TEST_SCOPE"

  timeout_seconds: 1800
  poll_interval_seconds: 5

  # 结果判定（不得将非 SUCCESS 判为通过）
  result_policy:
    accept: ["SUCCESS"]
    analyze: ["UNSTABLE"]
    reject: ["FAILURE", "ABORTED", "NOT_BUILT"]
